name: Northline TV for Windows and Mac

on:
  push:
    paths: ['desktop/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unpack the app
        shell: pwsh
        run: Expand-Archive -Path desktop/northline-desktop-src.zip -DestinationPath app-src
      - name: Install
        working-directory: app-src
        shell: bash
        run: npm ci || npm install
      - name: Build Windows installer
        if: runner.os == 'Windows'
        working-directory: app-src
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --publish never
      - name: Build Mac app
        if: runner.os == 'macOS'
        working-directory: app-src
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --mac --publish never
          APP="$(ls -d dist/mac-universal/*.app | head -1)"
          # ad-hoc signature so Apple Silicon Macs will open it (right-click > Open the first time)
          codesign --force --deep --sign - "$APP"
          mkdir -p dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Northline TV" -srcfolder dmg -ov -format UDZO dist/NorthlineTV.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: northline-${{ runner.os }}
          path: |
            app-src/dist/NorthlineTV-Setup.exe
            app-src/dist/NorthlineTV.dmg
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: echo "version=$(unzip -p desktop/northline-desktop-src.zip package.json | jq -r .version)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.v.outputs.version }}
          name: Northline TV for Windows & Mac ${{ steps.v.outputs.version }}
          make_latest: 'false'
          files: out/*
          body: |
            Northline TV for your computer. Sign in with your own server, username and password, like on a Fire Stick.

            **Windows 10/11:** download NorthlineTV-Setup.exe and open it. If Windows says "Windows protected your PC", click More info, then Run anyway.

            **Mac:** download NorthlineTV.dmg, open it and drag Northline TV into Applications. The first time, right-click Northline TV in Applications and choose Open, then Open again.
